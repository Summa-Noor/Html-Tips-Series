<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center tag and hr tag</title>
</head>

<body>

    <!-- ====== THIS IS CENTER TAG===========  -->
    <center>
        <h1> This is Center Tag</h1>
    </center>

    <!-- ====== THIS IS HR HORIZONTAL TAG===========  -->

    <h1>This is Horizontal Line hr Tag👇🏻</h1>
    <hr>
</body>

</html>
